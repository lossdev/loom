<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <title>Loom favicon 32px</title>
  <g transform="translate(16, 16)">
    <rect x="-16" y="-16" width="32" height="32" rx="5" fill="#534AB7"/>
    <!-- Warp threads -->
    <line x1="-9.5" y1="-10" x2="-9.5" y2="10" stroke="#CECBF6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-4"   y1="-10" x2="-4"   y2="10" stroke="#CECBF6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0.5"  y1="-10" x2="0.5"  y2="10" stroke="#CECBF6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="5"    y1="-10" x2="5"    y2="10" stroke="#CECBF6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="9.5"  y1="-10" x2="9.5"  y2="10" stroke="#CECBF6" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Weft row 1 -->
    <line x1="-13" y1="-6"  x2="-11.5" y2="-6" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-7"  y1="-6"  x2="-2"    y2="-6" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="2.5" y1="-6"  x2="7"     y2="-6" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="11"  y1="-6"  x2="13"    y2="-6" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Weft row 2 -->
    <line x1="-13" y1="0"   x2="-6"    y2="0"  stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-2"  y1="0"   x2="2.5"   y2="0"  stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="7"   y1="0"   x2="13"    y2="0"  stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Weft row 3 -->
    <line x1="-13" y1="6"   x2="-11.5" y2="6"  stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-7"  y1="6"   x2="-2"    y2="6"  stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="2.5" y1="6"   x2="7"     y2="6"  stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="11"  y1="6"   x2="13"    y2="6"  stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
