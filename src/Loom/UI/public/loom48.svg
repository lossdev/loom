<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <title>Loom icon 48px</title>
  <g transform="translate(24, 24)">
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#534AB7"/>
    <!-- Warp threads -->
    <line x1="-14" y1="-16" x2="-14" y2="16" stroke="#CECBF6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-7"  y1="-16" x2="-7"  y2="16" stroke="#CECBF6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0"   y1="-16" x2="0"   y2="16" stroke="#CECBF6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="7"   y1="-16" x2="7"   y2="16" stroke="#CECBF6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="14"  y1="-16" x2="14"  y2="16" stroke="#CECBF6" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Weft row 1 -->
    <line x1="-20" y1="-10" x2="-16" y2="-10" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-11" y1="-10" x2="-3"  y2="-10" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="3"   y1="-10" x2="11"  y2="-10" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="16"  y1="-10" x2="20"  y2="-10" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Weft row 2 -->
    <line x1="-20" y1="0"   x2="-9"  y2="0"   stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-3"  y1="0"   x2="3"   y2="0"   stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="9"   y1="0"   x2="20"  y2="0"   stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Weft row 3 -->
    <line x1="-20" y1="10"  x2="-16" y2="10"  stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-11" y1="10"  x2="-3"  y2="10"  stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="3"   y1="10"  x2="11"  y2="10"  stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="16"  y1="10"  x2="20"  y2="10"  stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
