# This workflow type-checks and bundles the React client.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: UI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/Loom/UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm
        cache-dependency-path: src/Loom/UI/package-lock.json
    - name: Install dependencies
      run: npm ci
    # `npm run build` is `tsc -b && vite build`, so this covers both the
    # type-check and the bundle.
    - name: Build
      run: npm run build
